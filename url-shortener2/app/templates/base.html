<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}URL Shortener{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{{ url_for('main.index') }}">URL Shortener</a></h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('main.index') }}">Головна</a></li>
                    <li><a href="{{ url_for('main.stats') }}">Статистика</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2025 URL Shortener</p>
        </div>
    </footer>
</body>
</html>
