<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вікторина</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if question %}
    <h1>{{question[1]}}</h1>
  {% endif %}
  <form method="post" action="quiz">
    <input type="hidden" name="q_id" value="{{question[0]}}">
    <div class="outer-div">
      {% for answer in answers_list %}
        <div class="form_radio_btn">
            <input type="radio" name="ans_text" value="{{ answer }}">{{ answer }}
        </div>
      {% endfor %}
      <div class="inner-div">
        <p>
          <input class="btn" type="submit" value="Відповісти">
        </p>
      </div>
    </div>
  </form>
