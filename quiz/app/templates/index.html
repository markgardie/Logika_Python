{% extends "base.html" %}

{% block title %}Вікторина - Головна{% endblock %}

{% block content %}
<div>
    <h2>Оберіть питання для початку вікторини:</h2>
    <ul>
        {% for question in questions %}
            <li><a href="{{ url_for('quiz.question', question_id=question.id) }}">{{ question.question }}</a></li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
